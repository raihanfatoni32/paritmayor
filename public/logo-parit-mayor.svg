<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0A58CA" stroke="#FFD700" stroke-width="3"/>
  <!-- Inner circle ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Canal/Parit: wavy water lines -->
  <path d="M18 60 Q25 55 32 60 Q39 65 46 60 Q53 55 60 60 Q67 65 74 60 Q81 55 82 58" fill="none" stroke="#7EC8F7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20 65 Q27 60 34 65 Q41 70 48 65 Q55 60 62 65 Q69 70 76 65 Q80 63 80 63" fill="none" stroke="#7EC8F7" stroke-width="2" stroke-linecap="round"/>

  <!-- Bridge over canal -->
  <path d="M30 60 Q50 48 70 60" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="37" y1="56" x2="37" y2="65" stroke="#FFD700" stroke-width="2"/>
  <line x1="50" y1="50" x2="50" y2="65" stroke="#FFD700" stroke-width="2"/>
  <line x1="63" y1="56" x2="63" y2="65" stroke="#FFD700" stroke-width="2"/>

  <!-- House/Building center top -->
  <polygon points="50,22 38,34 62,34" fill="#FFD700"/>
  <rect x="41" y="34" width="18" height="13" fill="#FFD700" opacity="0.9"/>
  <rect x="47" y="38" width="6" height="9" fill="#0A58CA"/>

  <!-- Left palm tree -->
  <line x1="25" y1="58" x2="25" y2="40" stroke="#4CAF50" stroke-width="2"/>
  <ellipse cx="22" cy="37" rx="5" ry="3" fill="#4CAF50" transform="rotate(-20 22 37)"/>
  <ellipse cx="28" cy="36" rx="5" ry="3" fill="#4CAF50" transform="rotate(15 28 36)"/>
  <ellipse cx="25" cy="34" rx="4" ry="2.5" fill="#66BB6A"/>

  <!-- Right palm tree -->
  <line x1="75" y1="58" x2="75" y2="40" stroke="#4CAF50" stroke-width="2"/>
  <ellipse cx="72" cy="37" rx="5" ry="3" fill="#4CAF50" transform="rotate(-15 72 37)"/>
  <ellipse cx="78" cy="36" rx="5" ry="3" fill="#4CAF50" transform="rotate(20 78 36)"/>
  <ellipse cx="75" cy="34" rx="4" ry="2.5" fill="#66BB6A"/>

  <!-- Stars decorative -->
  <polygon points="50,12 51.5,16.5 56,16.5 52.5,19.5 53.8,24 50,21.5 46.2,24 47.5,19.5 44,16.5 48.5,16.5" fill="#FFD700"/>
</svg>
